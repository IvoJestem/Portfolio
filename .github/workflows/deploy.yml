name: Deploy to GitHub Pages

on:
  # Uruchom ten przepływ przy każdym pushu do gałęzi `main`
  push:
    branches:
      - main
  # Pozwala na ręczne uruchomienie z zakładki "Actions"
  workflow_dispatch:

# Nadanie uprawnień potrzebnych do wdrożenia na GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Upewnienie się, że działa tylko jeden proces wdrażania naraz
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload production-ready build files
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4